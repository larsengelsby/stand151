name: Tjek stand

on:
  schedule:
    # Hver 3. time (tiderne er UTC, dvs. kl. 01.17, 04.17, 07.17 ... dansk sommertid +2)
    - cron: "17 */3 * * *"
  workflow_dispatch: {}   # gør det muligt at køre tjekket manuelt

permissions:
  contents: write

concurrency:
  group: tjek-stand
  cancel-in-progress: false

jobs:
  tjek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installér
        run: pip install requests beautifulsoup4

      - name: Hent standen og find solgte varer
        run: python tjek_stand.py

      - name: Gem resultatet
        run: |
          git config user.name "stand-bot"
          git config user.email "stand-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Tjek $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
